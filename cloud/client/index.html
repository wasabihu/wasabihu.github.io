<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>网上收藏夹 · Wasabi</title><meta name="description" content="Wasabi 的个人网址收藏夹，分类整理实用网站与工具。"><link rel="canonical" href="https://nav.tidyuse.com/"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/cloud.css"><script type="module" src="/app.mjs"></script></head>
<body><a class="skip-link" href="#collections">跳到收藏</a><div class="page"><header><a class="logo" href="/">Wasabi<span class="logo-caption">网上收藏夹</span></a><nav aria-label="站点导航"><a href="https://www.google.com/ncr" target="_blank" rel="noreferrer">Google ↗</a><a id="manage" href="/admin/">管理收藏</a><a id="logout" href="/cdn-cgi/access/logout" hidden>退出登录</a></nav></header>
<main><div class="intro"><div><h1 id="heading" class="sr-only">我的网址收藏</h1><p id="summary">正在读取收藏…</p></div><div class="actions" id="admin-actions" hidden><button id="add-category">新增分类</button><button id="add-link" class="primary">新增网址</button><button id="export">导出备份</button></div></div>
<div class="search"><span class="search-symbol" aria-hidden="true">⌕</span><label class="sr-only" for="search">搜索收藏</label><input id="search" type="search" placeholder="搜索分类、名称、备注或网址" autocomplete="off"><kbd aria-hidden="true">/</kbd><button id="clear-search">清空</button></div>
<div class="notice"><p id="status" role="status" aria-live="polite">正在连接云端…</p><button id="reload">重新加载</button><a id="reauth" href="/admin/" target="_blank" rel="noopener" hidden>重新登录 ↗</a></div>
<nav id="tabs" aria-label="收藏标签页"></nav><div id="collections"></div><noscript>请启用 JavaScript 查看和搜索收藏。</noscript>
</main><footer><span class="footer-signature">WASABI / BOOKMARKS</span><span>收好有用的网址，让每次寻找都简单一点。</span><a href="#">回到顶部 ↑</a></footer></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><h2 id="editor-title">新增网址</h2><p class="muted">保存后公开展示，请勿填写账号或密码。</p><input type="hidden" id="record-id"><div id="link-fields"><label for="link-name">名称</label><input id="link-name" maxlength="200" required><label for="link-url">网址</label><input id="link-url" type="url" placeholder="https://example.com" maxlength="2048" required><label for="link-category">所属分类</label><select id="link-category" required></select><label for="link-note">备注（可选）</label><textarea id="link-note" maxlength="2000" rows="3"></textarea></div><div id="category-fields" hidden><label for="category-name">分类名称</label><input id="category-name" maxlength="120"><label for="category-page">标签页</label><select id="category-page"></select></div><label for="record-order">排序</label><input id="record-order" type="number" min="0" max="1000000" step="1" required><p id="form-error" role="alert"></p><div id="form-recovery" hidden><button id="reload-editor" type="button">加载最新收藏，保留输入</button><a href="/admin/" target="_blank" rel="noopener">重新登录 ↗</a></div><div id="delete-confirmation" class="delete-confirmation" hidden role="group" aria-label="删除确认"><p id="delete-message"></p><button id="keep-record" type="button">保留</button><button id="confirm-delete" type="button" class="danger">确认删除</button></div><div class="form-actions"><button id="delete" type="button" class="danger" hidden>删除</button><button id="cancel" type="button">取消</button><button id="save" class="primary" type="submit">保存到云端</button></div></form></dialog>
</body></html>
